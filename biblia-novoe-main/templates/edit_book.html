{% extends "base.html" %}
{% block title %}Редактировать книгу — LibraryOS{% endblock %}
{% block topbar_title %}Редактировать книгу{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h2>Редактировать книгу</h2>
        <p>{{ book.title }}</p>
    </div>
    <a href="/books" class="btn btn-secondary">← Назад к каталогу</a>
</div>

<div class="card">
    <form method="POST">
        <div class="form-grid">

            <div class="form-group">
                <label>Название книги <span class="required-star">*</span></label>
                <input type="text" name="title" value="{{ book.title }}" required>
            </div>

            <div class="form-group">
                <label>Автор <span class="required-star">*</span></label>
                <input type="text" name="author" value="{{ book.author }}" required>
            </div>

            <div class="form-group">
                <label>ISBN</label>
                <input type="text" name="isbn" value="{{ book.isbn or '' }}">
            </div>

            <div class="form-group">
                <label>Издательство</label>
                <input type="text" name="publisher" value="{{ book.publisher or '' }}">
            </div>

            <div class="form-group">
                <label>Год издания</label>
                <input type="number" name="year" value="{{ book.year or '' }}" min="1000" max="2100">
            </div>

            <div class="form-group">
                <label>Количество экземпляров <span class="required-star">*</span></label>
                <input type="number" name="quantity" value="{{ book.quantity }}" min="1" required>
            </div>

            <div class="form-group form-span-full">
                <label>Категория</label>
                <select name="category">
                    <option value="">— Выберите категорию —</option>
                    {% set cats = ['Художественная литература','Научная литература','Учебная литература','Детская литература','Справочная литература','Техническая литература'] %}
                    {% for cat in cats %}
                    <option value="{{ cat }}" {% if book.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

        </div>

        <div class="form-actions" style="margin-top: 24px;">
            <button type="submit" class="btn btn-primary">💾 Сохранить изменения</button>
            <a href="/books" class="btn btn-secondary">Отмена</a>
            <a href="/books/delete/{{ book.id }}" class="btn btn-danger"
               onclick="return confirm('Удалить книгу «{{ book.title }}»?')"
               style="margin-left: auto;">🗑️ Удалить книгу</a>
        </div>
    </form>
</div>

{% endblock %}
