{% extends "base.html" %}
{% block title %}Добавить читателя — LibraryOS{% endblock %}
{% block topbar_title %}Добавить читателя{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h2>Добавить читателя</h2>
        <p>Регистрация нового читателя в системе</p>
    </div>
    <a href="/readers" class="btn btn-secondary">← Назад к читателям</a>
</div>

<div class="card">
    <form method="POST">
        <div class="form-grid">

            <div class="form-group form-span-full">
                <label>ФИО <span class="required-star">*</span></label>
                <input type="text" name="full_name" placeholder="Фамилия Имя Отчество" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="example@mail.ru">
            </div>

            <div class="form-group">
                <label>Телефон</label>
                <input type="tel" name="phone" placeholder="+7-900-000-00-00">
            </div>

            <div class="form-group form-span-full">
                <label>Адрес</label>
                <textarea name="address" placeholder="г. Город, ул. Улица, д. X, кв. X"></textarea>
            </div>

        </div>

        <div class="form-actions" style="margin-top: 24px;">
            <button type="submit" class="btn btn-primary">💾 Сохранить читателя</button>
            <a href="/readers" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>

{% endblock %}
